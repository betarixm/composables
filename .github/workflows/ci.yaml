name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to match against the package version
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright

  build:
    name: Build and test source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Check release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          package_version="$(uv version --package composables --short)"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag must be v$package_version; received $RELEASE_TAG" >&2
            exit 1
          fi
      - run: uv sync --locked --no-install-workspace
      - run: uv build --package composables --no-sources --out-dir dist
      - run: uv run --no-sync twine check --strict dist/*
      - name: Install source distribution
        run: uv pip install --python .venv dist/*.tar.gz
      - run: uv run --no-sync pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  test:
    name: Wheel / ${{ matrix.operating-system }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - operating-system: macos-latest
            python-version: "3.12"
          - operating-system: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - run: uv sync --locked --no-install-workspace
      - name: Install wheel
        run: uv pip install --python .venv dist/*.whl
      - run: uv run --no-sync pytest
